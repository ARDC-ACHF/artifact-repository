<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Linked Art Interoperability Repository — Cross-domain search</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --muted: #94a3b8; --text: #e2e8f0;
      --accent: #38bdf8; --chip: #334155; --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    header { padding: 1.5rem 1rem; border-bottom: 1px solid var(--border); }
    header h1 { margin: 0 0 .25rem; font-size: 1.35rem; }
    header p { margin: 0; color: var(--muted); font-size: .9rem; }
    main { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .search-row { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
    .search-row input[type=search] {
      flex: 1 1 260px; padding: .6rem .8rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 1rem;
    }
    .filters { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    select, button {
      padding: .55rem .7rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: .9rem; cursor: pointer;
    }
    button.primary { background: var(--accent); color: #082f49; border-color: var(--accent); font-weight: 600; }
    .meta { color: var(--muted); font-size: .85rem; margin: .25rem 0 1rem; }
    ul.results { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
    li.card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: .8rem 1rem; cursor: pointer; transition: border-color .15s;
    }
    li.card:hover { border-color: var(--accent); }
    li.card h3 { margin: 0 0 .3rem; font-size: 1.05rem; }
    .chips { display: flex; gap: .4rem; flex-wrap: wrap; }
    .chip {
      background: var(--chip); color: var(--text); border-radius: 999px;
      padding: .1rem .6rem; font-size: .75rem;
    }
    .chip.type { background: #0c4a6e; }
    .chip.partner { background: #4c1d95; }
    .empty { color: var(--muted); padding: 1rem 0; }
    /* Detail modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: none; align-items: center; justify-content: center; padding: 1rem;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      max-width: 720px; width: 100%; max-height: 85vh; overflow: auto; padding: 1.25rem;
    }
    .modal h2 { margin-top: 0; }
    .modal a { color: var(--accent); }
    pre {
      background: #0b1220; border: 1px solid var(--border); border-radius: 8px;
      padding: .8rem; overflow: auto; font-size: .8rem;
    }
    .close { float: right; }
    a.origin { display: inline-block; margin: .5rem 0; }
    /* Version history */
    .versions { margin: .75rem 0; }
    .versions h3 { margin: 0 0 .4rem; font-size: .95rem; color: var(--muted); }
    ul.version-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .35rem; }
    li.version {
      display: flex; align-items: center; gap: .5rem; cursor: pointer;
      background: #0b1220; border: 1px solid var(--border); border-radius: 8px;
      padding: .4rem .6rem; font-size: .82rem;
    }
    li.version:hover { border-color: var(--accent); }
    li.version.active {
      border-color: var(--accent); background: #0f2436;
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    li.version .date { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    li.version .relative { color: var(--muted); font-size: .78rem; }
    .badge {
      background: #0c4a6e; color: var(--text); border-radius: 999px;
      padding: .05rem .5rem; font-size: .7rem;
    }
    .badge.viewing { background: var(--accent); color: #082f49; }
    li.version .permalink {
      margin-left: auto; color: var(--muted); text-decoration: none;
      font-size: .78rem; padding: .1rem .3rem; border-radius: 4px;
    }
    li.version .permalink:hover { color: var(--accent); background: #0f1b2e; }
    a.pid-link {
      color: var(--accent); text-decoration: underline dotted; cursor: pointer;
    }
    a.pid-link:hover { text-decoration: underline solid; }
  </style>
</head>
<body>
  <header>
    <h1>ACHF Lson-LD respository</h1>
    <p></p>
  </header>
  <main>
    <form id="search-form">
      <div class="search-row">
        <input id="q" type="search" placeholder="Search e.g. &quot;Beckett&quot; or &quot;Godot&quot;…" autocomplete="off" />
        <button class="primary" type="submit">Search</button>
      </div>
      <div class="filters">
        <select id="type"><option value="">All types</option></select>
        <select id="partner"><option value="">All partners</option></select>
      </div>
    </form>
    <div id="meta" class="meta"></div>
    <ul id="results" class="results"></ul>
    <div id="empty" class="empty" hidden>No results. Try a different term.</div>
  </main>

  <div id="overlay" class="overlay">
    <div class="modal">
      <button id="close" class="close">Close</button>
      <h2 id="d-label"></h2>
      <div class="chips">
        <span id="d-type" class="chip type"></span>
        <span id="d-partner" class="chip partner"></span>
      </div>
      <a id="d-origin" class="origin" href="#" target="_blank" rel="noopener">Open original IRI ↗</a>
      <div id="d-versions" class="versions"></div>
      <pre id="d-body"></pre>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
