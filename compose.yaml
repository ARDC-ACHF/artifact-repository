services:
  app:
    build: .
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      API_AUTH_USERNAME: ${API_AUTH_USERNAME:-}
      API_AUTH_PASSWORD: ${API_AUTH_PASSWORD:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
